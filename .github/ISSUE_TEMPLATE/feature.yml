name: Feature request
description: Propose an addition or change to the SDK
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        What should the SDK do and why. Wire-level behavior goes through
        kilden-sdk-spec first; client-surface changes (identity, screens,
        lifecycle) are discussed here.
    validations:
      required: true
